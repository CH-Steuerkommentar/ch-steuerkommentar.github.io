name: Website

on:
  push:
    branches: [main]
    paths: ["kommentare/**", "site/**", "pipeline/**", "data/inventar/**", "data/queue.json", ".github/workflows/**"]
  workflow_dispatch:
  # Pushes des Kommentar-Agents (GITHUB_TOKEN) lösen keinen push-Trigger aus; deshalb danach bauen.
  workflow_run:
    workflows: ["Kommentar-Agent"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kommentierungen prüfen und in Seiten umwandeln
        run: python3 pipeline/md2site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Website bauen
        working-directory: site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}/
          EDIT_LINK: https://github.com/${{ github.repository }}/edit/main/
        run: |
          npm ci
          npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
