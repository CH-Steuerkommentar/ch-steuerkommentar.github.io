name: Kommentar-Agent

# Kommentiert Artikel um Artikel über die API (API-Guthaben der Console), Opus 5.5 mit hoher Stufe.
# Startet stündlich; läuft schon ein Lauf, wartet der nächste (nie zwei gleichzeitig).
# Kein Tageslimit; Monatsbudget 100 USD (änderbar unter Settings > Secrets and variables > Actions > Variables).
# Ein- und ausschalten: Actions > Kommentar-Agent > «…» > Disable workflow / Enable workflow.
# Von Hand starten: Actions > Kommentar-Agent > Run workflow.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kommentar-agent
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git-Identität
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete
        run: pip install -r requirements.txt claude-agent-sdk
      - name: Skill aus Secret (liegt nicht im Repository)
        env:
          BUNDLE: ${{ secrets.STEUERKOMMENTAR_BUNDLE }}
        run: |
          test -n "$BUNDLE" || { echo "Secret STEUERKOMMENTAR_BUNDLE fehlt"; exit 1; }
          mkdir -p /tmp/bundle .claude/skills
          echo "$BUNDLE" | base64 -d | tar xJ -C /tmp/bundle
          cp -r /tmp/bundle/skills/steuerkommentar-selbstaendig .claude/skills/
          cp -r /tmp/bundle/ok-steuerkommentar "$HOME/ok-steuerkommentar"
      - name: Entscheid-Cache
        uses: actions/cache@v4
        with:
          path: data/entscheide
          key: entscheide-${{ github.run_id }}
          restore-keys: entscheide-
      - name: Lauf
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEXPLORER_API_KEY: ${{ secrets.LEXPLORER_API_KEY }}
          TAGESBUDGET_USD: ${{ vars.TAGESBUDGET_USD || '100' }}
          MONATSBUDGET_USD: ${{ vars.MONATSBUDGET_USD || '100' }}
          MODELL_SCHREIBEN: ${{ vars.MODELL_SCHREIBEN || 'claude-opus-5-5' }}
          EFFORT: ${{ vars.EFFORT || 'high' }}
          WER: github-actions
          GH_TOKEN: ${{ github.token }}
        run: python3 automation/lauf.py
